[workspace]
resolver = "3"
members = [
    "crates/agm-cli",
    "crates/agm-core",
    "crates/agm-config",
    "crates/agm-harness",
    "crates/agm-skills",
    "crates/agm-registry",
]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
agm-cli = { path = "crates/agm-cli" }
agm-core = { path = "crates/agm-core" }
agm-config = { path = "crates/agm-config" }
agm-harness = { path = "crates/agm-harness" }
agm-skills = { path = "crates/agm-skills" }
agm-registry = { path = "crates/agm-registry" }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
dirs = "6"
octocrab = "0.43"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
assert_cmd = "2.2.2"
predicates = "3.1.4"
